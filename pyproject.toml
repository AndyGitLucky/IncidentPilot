[project]
name = "incidentpilot"
version = "0.0.1"
description = "Controlled Kubernetes incident response: M0 demo baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "psycopg[binary]==3.2.9",
    "prometheus-client==0.21.1",
]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1", "PyYAML==6.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
