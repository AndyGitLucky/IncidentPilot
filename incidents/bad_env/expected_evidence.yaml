incident_id: bad_env
required_evidence:
  - "deployment and pod db_host: postgres-m4-missing"
  - "pod phase: Running"
  - "pod ready: false"
  - "logs: Database health check failed for the same pod UID"
limitations:
  - Only one fixed fixture may be active at a time.
  - Correlate current deployment-owned ReplicaSet and nonterminating pod UIDs.
  - Historical events and unrelated pod logs cannot support the diagnosis.
  - This fixture changes a non-secret hostname; Secret reads and arbitrary environment writes remain forbidden.
  - RollingUpdate can retain the old healthy replica; HTTP alone does not establish recovery.
