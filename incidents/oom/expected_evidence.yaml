incident_id: oom
required_evidence:
  - "deployment and pod memory request: 16Mi"
  - "deployment and pod memory limit: 16Mi"
  - "pod termination reason: OOMKilled"
  - "pod restart_count: greater than zero"
  - "pod ready: false"
limitations:
  - Only one fixed fixture may be active at a time.
  - Correlate current deployment-owned ReplicaSet and nonterminating pod UIDs.
  - Historical events and unrelated pod logs cannot support the diagnosis.
  - OOMKilled can appear in last termination state while the container waits in CrashLoopBackOff.
  - RollingUpdate can retain the old healthy replica; HTTP alone does not establish recovery.
