apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: incidentpilot-observability
resources:
  - stack.yaml
configMapGenerator:
  - name: tempo-config
    files:
      - tempo.yaml=../../telemetry/tempo.yaml
  - name: grafana-provisioning
    files:
      - datasources.yaml=../../telemetry/grafana/datasources.yaml
      - dashboards.yaml=../../telemetry/grafana/dashboards.yaml
  - name: grafana-dashboard
    files:
      - incidentpilot.json=../../telemetry/grafana/incidentpilot.json
