# Public demo credentials, valid only for this disposable local cluster.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-demo
type: Opaque
stringData:
  POSTGRES_DB: incidentpilot
  POSTGRES_USER: incidentpilot
  POSTGRES_PASSWORD: incidentpilot-local-only
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17.5-alpine
          envFrom:
            - secretRef:
                name: postgres-demo
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          readinessProbe:
            exec:
              command: [pg_isready, -U, incidentpilot, -d, incidentpilot]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, incidentpilot, -d, incidentpilot]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: postgres
