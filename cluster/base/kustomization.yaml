apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: incidentpilot
resources:
  - namespace.yaml
  - postgres.yaml
  - api.yaml
  - frontend.yaml
  - prometheus.yaml
configMapGenerator:
  - name: postgres-init
    files:
      - init.sql=../../app/db/init.sql
generatorOptions:
  disableNameSuffixHash: false
